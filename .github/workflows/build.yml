name: Build GM Nginx (Tengine + Tongsuo)

# 国密版 nginx 编译流水线
# 产物：x86_64（CentOS 7 兼容，glibc 2.17）+ aarch64（麒麟 V10/UOS 兼容，glibc 2.28）
# 组合：Tengine 2.4.1 + Tongsuo 8.2.1，模块 ngx_tongsuo_ntls（国密 NTLS）
#
# 设计说明：
# 1. 编译在旧 glibc 容器内进行（保证产物兼容老系统），产物通过挂载卷落到 runner 原生目录，
#    上传 action 跑在原生环境（规避 GitHub 将 action 强制 Node 24 与 centos:7 glibc 2.17 不兼容）
# 2. 国密握手自测直接在 CentOS 7 编译容器内完成：容器原生自带 libpcre/libcrypt/libz，
#    完全绕开 Ubuntu 24.04 验证环境的依赖问题（该环境已移除 libpcre3 等老库包）

on:
  workflow_dispatch: # 手动触发

jobs:
  # ============ x86_64：CentOS 7 服务器用（含容器内国密握手自测）============
  build-x86_64:
    runs-on: ubuntu-latest # x64 runner
    steps:
      - name: Checkout repo (test certs & selfcheck conf)
        uses: actions/checkout@v4

      - name: Build in CentOS 7 container (glibc 2.17)
        run: |
          # 第一步：容器内编译（产物落挂载卷 /work/install）
          docker run --rm -v "$PWD:/work" -w /work centos:7.9.2009 bash -c '
            set -e
            sed -i "s/mirrorlist=/#mirrorlist=/g" /etc/yum.repos.d/CentOS-*.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*.repo
            yum -y install gcc gcc-c++ make pcre-devel zlib-devel perl wget tar
            wget -c https://github.com/alibaba/tengine/archive/refs/tags/2.4.1.tar.gz -O tengine-2.4.1.tar.gz
            wget -c https://github.com/Tongsuo-Project/Tongsuo/archive/refs/tags/8.2.1.tar.gz -O Tongsuo-8.2.1.tar.gz
            tar xzf tengine-2.4.1.tar.gz
            tar xzf Tongsuo-8.2.1.tar.gz
            cd tengine-2.4.1
            ./configure --prefix=/work/install/tengine \
              --add-module=modules/ngx_tongsuo_ntls \
              --with-openssl=../Tongsuo-8.2.1 \
              --with-openssl-opt="enable-ntls" \
              --with-http_ssl_module \
              --with-http_realip_module \
              --with-http_stub_status_module \
              --with-http_gzip_static_module \
              --with-stream \
              --with-stream_ssl_module
            make -j"$(nproc)"
            make install
          '

          # 第二步：后台容器启动 Tengine（端口映射 8443 到 runner）
          docker run -d --name gm-selfcheck -p 8443:8443 -v "$PWD:/work" -w /work \
            centos:7.9.2009 bash -c '
            cp /work/ci/nginx-selfcheck.conf /work/install/tengine/conf/nginx.conf
            /work/install/tengine/sbin/nginx -t || exit 1
            /work/install/tengine/sbin/nginx
            sleep 600'
          sleep 2
          echo "=== Tengine 已启动（容器 gm-selfcheck，映射 127.0.0.1:8443）==="
          docker logs gm-selfcheck 2>&1 | tail -5

          # 第三步：编译 GmSSL 客户端（runner 原生 Ubuntu，TLCP 标准国密客户端）
          # Tongsuo s_client 的 -ciphersuites 解析有 bug 无法 offer TLS1.3 国密套件，
          # 改用 GmSSL tlcp_client 验证（国标 TLCP 协议，与 NTLS 互通）
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc
          wget -q -c https://github.com/guanzhi/GmSSL/archive/refs/tags/v3.1.1.tar.gz -O gmssl.tar.gz
          tar xzf gmssl.tar.gz
          cd GmSSL-3.1.1
          cmake -S . -B build > /tmp/gmssl-cmake.log 2>&1 || { cat /tmp/gmssl-cmake.log; exit 1; }
          cmake --build build -j"$(nproc)" > /tmp/gmssl-make.log 2>&1 || { tail -20 /tmp/gmssl-make.log; exit 1; }
          echo "=== GmSSL 客户端就绪 ==="
          ./build/bin/gmssl version

          # 第四步：国密握手（GmSSL tlcp_client -> 容器内 Tengine）
          echo "=== 国密握手测试 ==="
          echo | ./build/bin/gmssl tlcp_client -host 127.0.0.1 -port 8443 \
            > /tmp/handshake.log 2>&1
          cat /tmp/handshake.log
          if grep -q "Connection established" /tmp/handshake.log; then
            echo "PASS: 国密握手成功（GmSSL 客户端与 Tengine NTLS 互通）"
          else
            echo "FAIL: 国密握手失败"
            echo "--- 容器内 nginx error log ---"
            docker exec gm-selfcheck tail -30 /work/install/tengine/logs/error.log || true
            exit 1
          fi

          # 清理
          docker stop gm-selfcheck > /dev/null 2>&1 || true
          docker rm gm-selfcheck > /dev/null 2>&1 || true

      - name: Package artifact
        run: |
          # nginx 运行创建的 temp 目录属主为容器内 root，先归还权限再打包
          sudo chown -R "$USER" install
          mkdir -p dist
          tar czf dist/tengine-gm-2.4.1-x86_64-centos7-glibc217.tar.gz -C install tengine
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tengine-gm-x86_64
          path: dist/*.tar.gz
          retention-days: 30

  # ============ aarch64：麒麟 V10 / UOS 服务器用 ============
  build-aarch64:
    runs-on: ubuntu-24.04-arm # arm64 runner（公开仓库免费）
    steps:
      - name: Build in AlmaLinux 8 container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD:/work" -w /work almalinux:8 bash -c '
            set -e
            dnf -y install gcc gcc-c++ make pcre-devel zlib-devel perl wget tar
            wget -c https://github.com/alibaba/tengine/archive/refs/tags/2.4.1.tar.gz -O tengine-2.4.1.tar.gz
            wget -c https://github.com/Tongsuo-Project/Tongsuo/archive/refs/tags/8.2.1.tar.gz -O Tongsuo-8.2.1.tar.gz
            tar xzf tengine-2.4.1.tar.gz
            tar xzf Tongsuo-8.2.1.tar.gz
            cd tengine-2.4.1
            ./configure --prefix=/work/install/tengine \
              --add-module=modules/ngx_tongsuo_ntls \
              --with-openssl=../Tongsuo-8.2.1 \
              --with-openssl-opt="enable-ntls" \
              --with-http_ssl_module \
              --with-http_realip_module \
              --with-http_stub_status_module \
              --with-http_gzip_static_module \
              --with-stream \
              --with-stream_ssl_module
            make -j"$(nproc)"
            make install
          '

      - name: Package artifact
        run: |
          mkdir -p dist
          tar czf dist/tengine-gm-2.4.1-aarch64-kyv10-glibc228.tar.gz -C install tengine
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tengine-gm-aarch64
          path: dist/*.tar.gz
          retention-days: 30

  # ============ 部署演练：按 README 上线教程在云端完整走一遍 ============
  # 验证 deploy/precheck.sh、nginx-gm.conf.example 及七步流程的有效性
  # 注意：runner 无 systemd，tengine.service 仅做语法校验，真实启停需在服务器验证
  deploy-rehearsal:
    runs-on: ubuntu-latest
    needs: build-x86_64
    steps:
      - name: Checkout repo (deploy scripts & certs)
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tengine-gm-x86_64
          path: dist

      - name: 步骤1 演练：解压产物到 /usr/local
        run: |
          sudo tar xzf dist/*.tar.gz -C /usr/local
          ls -lh /usr/local/tengine/sbin/nginx
          /usr/local/tengine/sbin/nginx -V 2>&1 | grep -E "Tengine|ntls|Tongsuo" | head -3

      - name: 步骤2a 演练：precheck 首跑（预期发现依赖缺失 FAIL）
        run: |
          bash deploy/precheck.sh 8443 > /tmp/precheck-1.log 2>&1 || true
          cat /tmp/precheck-1.log | grep -E "FAIL|SKIP|PASS|WARN|提示" | head -15
          echo ""
          if grep -q "FAIL" /tmp/precheck-1.log; then
            echo ">>> precheck 如预期抓出了问题（runner 环境缺 libpcre.so.1/libcrypt.so.1），进入修复步骤"
          else
            echo ">>> 首跑无 FAIL"
          fi

      - name: 步骤2b 演练：按预案补齐依赖（Ubuntu 24.04 场景）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcrypt1 zlib1g
          # libpcre.so.1：Ubuntu 24.04 已移除 libpcre3 包，从 22.04 存档 deb 解包安装
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/p/pcre3/libpcre3_8.39-13ubuntu0.22.04.1_amd64.deb -O /tmp/libpcre3.deb
          mkdir -p /tmp/pcre-extract
          dpkg -x /tmp/libpcre3.deb /tmp/pcre-extract
          sudo cp -a /tmp/pcre-extract/usr/lib/x86_64-linux-gnu/libpcre.so.1* /usr/lib/x86_64-linux-gnu/
          sudo ldconfig

      - name: 步骤2c 演练：precheck 复跑（预期全 PASS）
        run: |
          bash deploy/precheck.sh 8443 2>&1 | tee /tmp/precheck-2.log
          if grep -q "FAIL" /tmp/precheck-2.log; then
            echo ">>> FAIL: precheck 复跑仍有阻塞项"; exit 1
          fi
          echo ">>> PASS: precheck 复跑通过（修复预案有效）"

      - name: 步骤3 演练：放置证书
        run: |
          sudo mkdir -p /usr/local/tengine/conf/certs
          sudo cp test-certs/sign.pem test-certs/sign.key test-certs/enc.pem test-certs/enc.key /usr/local/tengine/conf/certs/
          ls -l /usr/local/tengine/conf/certs/

      - name: 步骤4 演练：用模板生成 nginx.conf（端口改 8443）
        run: |
          sed 's/listen 443 ssl;/listen 8443 ssl;/' deploy/nginx-gm.conf.example | sudo tee /usr/local/tengine/conf/nginx.conf > /dev/null
          echo "=== 生效配置中的国密指令 ==="
          grep -E "enable_ntls|ssl_(sign|enc)_certificate|ssl_ciphers" /usr/local/tengine/conf/nginx.conf

      - name: 步骤5a 演练：nginx -t 配置检查
        run: |
          sudo /usr/local/tengine/sbin/nginx -t -p /usr/local/tengine

      - name: 步骤5b 演练：systemd 单元语法校验（runner 无 systemd 运行环境）
        run: |
          sudo apt-get install -y -qq systemd
          sudo systemd-analyze verify deploy/tengine.service 2>&1 | head -10
          echo ">>> tengine.service 语法校验完成（实际启停请在真实服务器执行 systemctl enable --now tengine）"

      - name: 步骤5c 演练：启动 Tengine
        run: |
          sudo /usr/local/tengine/sbin/nginx -p /usr/local/tengine
          sleep 1
          ps aux | grep "[n]ginx" | head -3

      - name: 步骤6 演练：GmSSL 国密握手验证（等价 README 验证章节）
        run: |
          sudo apt-get install -y -qq cmake gcc
          wget -q -c https://github.com/guanzhi/GmSSL/archive/refs/tags/v3.1.1.tar.gz -O gmssl.tar.gz
          tar xzf gmssl.tar.gz
          cd GmSSL-3.1.1
          cmake -S . -B build > /dev/null 2>&1
          cmake --build build -j"$(nproc)" > /dev/null 2>&1
          echo "=== 国密握手（等价 README 步骤 6 命令）==="
          echo | ./build/bin/gmssl tlcp_client -host 127.0.0.1 -port 8443 | head -3
          echo | ./build/bin/gmssl tlcp_client -host 127.0.0.1 -port 8443 2>&1 | grep -q "Connection established" \
            && echo ">>> PASS: 部署演练完整通过（解压->体检->修复->证书->配置->启动->国密握手）" \
            || { echo ">>> FAIL: 握手失败"; exit 1; }

      - name: 步骤7 演练：清理（模拟回滚：停止并移除）
        run: |
          sudo /usr/local/tengine/sbin/nginx -s quit -p /usr/local/tengine || true
          sudo rm -rf /usr/local/tengine
          echo ">>> 回滚演练完成（停止服务并移除安装目录，旧服务不受影响）"
