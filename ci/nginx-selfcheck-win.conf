# Windows 版自测配置：MSYS2 环境内 nginx -t 校验国密双证书
# 注意：证书指令相对路径基准为 prefix/conf/，故写 certs/x.pem（实际文件在 conf/certs/）
worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;
events { worker_connections 128; }
http {
  server {
    listen 8443 ssl;
    server_name localhost;
    enable_ntls on;
    ssl_sign_certificate      certs/sign.pem;
    ssl_sign_certificate_key  certs/sign.key;
    ssl_enc_certificate       certs/enc.pem;
    ssl_enc_certificate_key   certs/enc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-SM2-WITH-SM4-SM3;
    location / { return 200 "gm-ok"; }
  }
}
