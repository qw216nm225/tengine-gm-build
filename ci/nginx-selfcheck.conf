# 云端自测配置：在 CentOS 7 编译容器内启动 Tengine 做国密握手验证
# 证书路径为容器内挂载目录的绝对路径
worker_processes 1;
error_log /work/install/tengine/logs/error.log debug;
pid /work/install/tengine/logs/nginx.pid;
events { worker_connections 128; }
http {
  server {
    listen 8443 ssl;
    server_name localhost;
    enable_ntls on;
    ssl_sign_certificate      /work/test-certs/sign.pem;
    ssl_sign_certificate_key  /work/test-certs/sign.key;
    ssl_enc_certificate       /work/test-certs/enc.pem;
    ssl_enc_certificate_key   /work/test-certs/enc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECC-SM2-SM4-CBC-SM3:ECC-SM2-SM4-GCM-SM3:ECDHE-SM2-WITH-SM4-SM3;
    location / { return 200 "gm-ok"; }
  }
}
